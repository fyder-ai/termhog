[package]
name = "termhog"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["posthog", "session-replay", "terminal", "pty", "rrweb"]
categories = ["development-tools", "command-line-interface"]

[package.metadata.docs.rs]
# docs.rs builds only the first target unless told otherwise, and the API
# differs on Windows.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[dependencies]
# avt with the erased-cell fix, published as a fork until asciinema releases
# it (https://github.com/asciinema/avt/pull/29). Imported as `avt`.
avt = { package = "termhog-avt", version = "0.18" }
crossbeam-channel = "0.5"
dirs = "7"
flate2 = "1"
log = "0.4.22"
serde = { version = "1.0.189", features = ["derive"] }
serde_json = "1.0.25"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1.6", features = ["v4", "v7"] }

[build-dependencies]
# Verify and unpack Microsoft's ConPTY package for Windows targets (build.rs).
flate2 = "1"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["poll", "process", "resource", "signal"] }
rustix = { version = "1", features = ["fs", "pipe", "process", "pty", "termios"] }
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
