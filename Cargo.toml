[package]
name = "ph-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Record terminal sessions as PostHog session replays"
repository = "https://github.com/watts-ai/ph-capture"

[[bin]]
name = "ph-capture"
path = "src/main.rs"

[dependencies]
anyhow = "1"
portable-pty = "0.9"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
libc = "0.2"
rustix = { version = "1", features = ["termios", "stdio"] }
log = "0.4"
avt = "0.18.0"
flate2 = "1.1.9"
uuid = { version = "1.20.0", features = ["v4", "v7"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
clap = { version = "4.5.61", features = ["derive"] }
thiserror = "2"
